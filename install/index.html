<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>FitWow - Install</title>
  <link rel="icon" type="image/png" href="../assets/app_icon_ios.png" />
  <link rel="apple-touch-icon" href="../assets/app_icon_ios.png" />
</head>
<body>
  <p>
    Redirecting to FitWow...
    <a id="store-link" href="/">Continue</a>
  </p>
  <script>
    (function () {
      var appStoreUrl = 'https://apps.apple.com/app/id6760663683';
      var googlePlayUrl = 'https://play.google.com/store/apps/details?id=com.fitwow.fitwow';
      var homeUrl = '/';
      var userAgent = navigator.userAgent || navigator.vendor || window.opera || '';
      var platform = navigator.platform || '';
      var isAndroid = /Android/i.test(userAgent);
      var isIos = /iPhone|iPad|iPod/i.test(userAgent) ||
        (platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      function getAndroidUrl() {
        var params = new URLSearchParams(window.location.search);
        var ref = params.get('ref');
        if (!ref) return googlePlayUrl;
        return googlePlayUrl + '&referrer=' + encodeURIComponent('ref=' + ref);
      }

      var targetUrl = isAndroid ? getAndroidUrl() : (isIos ? appStoreUrl : homeUrl);

      // Some in-app browsers (Instagram, Threads, Facebook) block a silent
      // location.replace() to App Store / Play Store links and show a blank
      // page instead. Point the visible link at the real target and trigger
      // it via a simulated click, which those webviews allow, and leave the
      // link on screen as a manual fallback if the auto-click is blocked.
      var link = document.getElementById('store-link');
      link.href = targetUrl;
      link.click();
    })();
  </script>
</body>
</html>
