<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>FitWow - Install</title>
  <link rel="icon" type="image/png" href="../assets/app_icon_ios.png" />
  <link rel="apple-touch-icon" href="../assets/app_icon_ios.png" />
</head>
<body>
  <p>
    <a id="store-link" href="/">Tap here to install FitWow</a>
  </p>
  <script>
    (function () {
      var appStoreUrl = 'https://apps.apple.com/app/id6760663683';
      var googlePlayUrl = 'https://play.google.com/store/apps/details?id=com.fitwow.fitwow';
      var homeUrl = '/';
      var userAgent = navigator.userAgent || navigator.vendor || window.opera || '';
      var platform = navigator.platform || '';
      var isAndroid = /Android/i.test(userAgent);
      var isIos = /iPhone|iPad|iPod/i.test(userAgent) ||
        (platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      function getAndroidUrl() {
        var params = new URLSearchParams(window.location.search);
        var ref = params.get('ref');
        if (!ref) return googlePlayUrl;
        return googlePlayUrl + '&referrer=' + encodeURIComponent('ref=' + ref);
      }

      var targetUrl = isAndroid ? getAndroidUrl() : (isIos ? appStoreUrl : homeUrl);

      // Instagram's in-app browser flags any page that redirects on its own
      // (location.replace, or even a synthetic click on load) as an unwanted
      // redirect and blocks navigation on that page instance entirely - even
      // a real tap afterwards stops working. So do nothing automatic here:
      // just point the visible link at the right target and let the user's
      // own tap perform the navigation.
      document.getElementById('store-link').href = targetUrl;
    })();
  </script>
</body>
</html>
